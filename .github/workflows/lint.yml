name: 🔍 Lint

on:
  push:
    branches: [main, develop]
    paths:
      - 'camila-product-react-ui/**'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'camila-product-react-ui/**'
      - '.github/workflows/lint.yml'

# Prevent multiple workflow runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint & Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: camila-product-react-ui

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Cache dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: |
            camila-product-react-ui/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-24-${{ hashFiles('camila-product-react-ui/package-lock.json', 'camila-product-react-ui/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-24-
            ${{ runner.os }}-node-

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🔍 Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: 🔎 TypeScript type check
        run: npx tsc --noEmit

      - name: 📊 Lint report
        if: always()
        run: |
          echo "✅ Linting completed!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
