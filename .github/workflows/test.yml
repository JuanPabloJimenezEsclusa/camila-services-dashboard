name: 🧪 Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'camila-product-react-ui/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'camila-product-react-ui/**'
      - '.github/workflows/test.yml'

# Prevent multiple workflow runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: camila-product-react-ui
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Cache dependencies
        uses: actions/cache@v4
        id: npm-cache-unit
        with:
          path: |
            camila-product-react-ui/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-24-${{ hashFiles('camila-product-react-ui/package-lock.json', 'camila-product-react-ui/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-24-
            ${{ runner.os }}-node-

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🧪 Run unit tests
        run: npm run test:run

      - name: 📊 Generate coverage report
        run: npm run test:coverage

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./camila-product-react-ui/coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 📊 Coverage summary
        if: always()
        run: |
          echo "### 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.txt 2>/dev/null || echo "Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: camila-product-react-ui
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Cache dependencies
        uses: actions/cache@v4
        id: npm-cache-e2e
        with:
          path: |
            camila-product-react-ui/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-24-${{ hashFiles('camila-product-react-ui/package-lock.json', 'camila-product-react-ui/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-24-
            ${{ runner.os }}-node-

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 📦 Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('camila-product-react-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 📦 Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 🏗️ Build application
        run: npm run build

      - name: 🧪 Run E2E tests (Mocked Backend)
        run: npm run test:e2e:mocked
        env:
          CI: true
          VITE_AUTH_ENABLED: false

      - name: 📤 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: camila-product-react-ui/playwright-report/
          retention-days: 7

      - name: 📤 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: camila-product-react-ui/test-results/
          retention-days: 7
