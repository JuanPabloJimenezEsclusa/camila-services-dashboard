user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  # Performance
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript
             application/x-javascript application/xml+rss
             application/javascript application/json
             application/vnd.ms-fontobject application/x-font-ttf
             font/opentype image/svg+xml image/x-icon;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;

  server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Runtime configuration endpoint
    location /config.js {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    # OAuth2 callback endpoint (Keycloak redirect)
    # This handles the OAuth2 callback after Keycloak authentication
    # The React app (client-side routing) processes the callback
    location = /callback {
      # Serve index.html for OAuth callback processing
      try_files /index.html =404;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";

      # Allow query parameters to pass through
      # (Keycloak sends code, state, session_state parameters)
      add_header X-OAuth-Callback "true";
    }

    # Static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Backend API reverse proxy
    # Proxies API requests to the backend gateway service
    # Backend accessible as: gateway (network alias or service name)
    location /product-dev/api {
      proxy_pass http://gateway:8090;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_cache_bypass $http_upgrade;
      
      # Timeouts
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # gRPC-Web reverse proxy (optional - for Envoy proxy)
    # Uncomment and configure if you want Nginx to proxy gRPC-Web requests
    # location ~ ^/product\. {
    #   grpc_pass grpc://envoy:8765;
    #   # For HTTP/2 gRPC
    #   # OR use proxy_pass for gRPC-Web:
    #   # proxy_pass http://envoy:8765;
    #   # proxy_http_version 1.1;
    #   # proxy_set_header Content-Type application/grpc-web+proto;
    #   # proxy_set_header X-Grpc-Web 1;
    # }

    # SPA routing - serve index.html for all routes
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
